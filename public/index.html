<head>

    <script>
        (function () {
            try {
                var job = JSON.parse(localStorage.getItem('photoUpload_job') || 'null');
                var fresh = job && (Date.now() - (job.updatedAt || 0) < 12 * 60 * 60 * 1000);
                var cookie = /(?:^|; )ls_photo_upload=(scanning|done)(?:;|$)/.test(document.cookie);
                if ((fresh && (job.status === 'scanning' || job.status === 'done')) || cookie) {
                    location.replace('PhotoUpload.html');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background-color: #020053;
            color: white;
            font-family: Arial, sans-serif;
        }

        .home-shell {
            height: 100%;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 3.2vh, 32px);
            padding: clamp(8px, 2.4vh, 28px) clamp(16px, 4vw, 48px);
            overflow: hidden;
        }

        .logo {
            margin: 0;
            width: auto;
            height: auto;
            max-width: min(46vw, 360px);
            max-height: min(38vh, 280px);
            object-fit: contain;
            flex: 0 1 auto;
        }

        .navigation {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            justify-items: center;
            align-items: start;
            gap: clamp(8px, 2vw, 28px);
            width: min(100%, 1100px);
            margin-top: 0;
            flex: 0 1 auto;
            min-height: 0;
        }

        .nav-item {
            text-align: center;
            text-decoration: none;
            color: white;
            width: 100%;
            max-width: 140px;
        }

        .nav-item img {
            width: min(100%, 18vw, 22vh, 140px);
            height: auto;
            max-height: min(22vh, 140px);
            object-fit: contain;
            display: block;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        .nav-item img:hover {
            transform: scale(1.06);
        }

        .nav-label {
            display: block;
            margin-top: 0.45em;
            font-size: clamp(0.72rem, 1.15vw, 1.02rem);
            font-weight: bold;
            letter-spacing: 0.4px;
            color: white;
            white-space: nowrap;
        }

        /* Icon card for pages without a custom image */
        .nav-icon-card {
            width: min(100%, 140px);
            height: min(22vh, 140px);
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.3s ease, background 0.3s ease;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            letter-spacing: 0.5px;
        }

        .nav-icon-card:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.18);
        }

        .nav-icon-card .icon {
            font-size: 2.8rem;
            line-height: 1;
        }

        /* Tracker group — image header + sub-buttons */
        /* Tracker submenu overlay */
        .tracker-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(2, 0, 83, 0.88);
            backdrop-filter: blur(6px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }
        .tracker-overlay.open { display: flex; }

        .tracker-overlay-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .tracker-overlay-title img {
            width: 180px;
            opacity: 0.92;
        }
        .tracker-overlay-title .nav-label {
            margin-top: 6px;
        }
        .tracker-overlay-close {
            position: absolute;
            top: 24px; right: 28px;
            font-size: 2rem; color: rgba(255,255,255,0.5);
            cursor: pointer; line-height: 1;
            transition: color 0.2s;
        }
        .tracker-overlay-close:hover { color: #fff; }

        .tracker-sub-menu {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-sub-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 130px;
            height: 130px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 18px;
            color: white;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.3px;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s;
            line-height: 1.3;
            padding: 10px;
        }
        .nav-sub-btn:hover {
            background: rgba(126,207,255,0.2);
            border-color: rgba(126,207,255,0.6);
            transform: scale(1.07);
        }
        .nav-sub-btn .sub-icon { font-size: 2.8rem; line-height: 1; }

        .tagline {
            display: none;
        }

        /* Mobile menu styling */
        .hamburger-menu {
            display: none;
            cursor: pointer;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: rgba(2, 0, 83, 0.8);
            padding: 10px;
            border-radius: 5px;
        }

        .hamburger-menu span {
            display: block;
            width: 30px;
            height: 3px;
            margin: 6px 0;
            background-color: white;
            transition: all 0.3s ease;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #020053;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .mobile-menu a {
            display: block;
            padding: 20px;
            margin: 10px 0;
            font-size: 1.5em;
            color: white;
            text-decoration: none;
            width: 80%;
            text-align: center;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mobile-menu a:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .mobile-menu .mobile-group {
            width: 80%;
            margin: 6px 0;
        }

        /* Tracker toggle button — looks like a regular menu item */
        .mobile-tracker-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            font-size: 1.5em;
            color: white;
            width: 100%;
            text-align: center;
            border-radius: 8px;
            background-color: rgba(255,255,255,0.15);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }
        .mobile-tracker-toggle:hover { background-color: rgba(255,255,255,0.25); }
        .mobile-tracker-toggle .arrow {
            font-size: 0.7em;
            transition: transform 0.25s;
            color: rgba(255,255,255,0.5);
        }
        .mobile-tracker-toggle.open .arrow { transform: rotate(90deg); }

        /* Submenu — hidden by default, slides open */
        .mobile-tracker-sub {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
            padding: 8px 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
        }
        .mobile-tracker-sub.open { display: flex; }
        .mobile-tracker-sub a {
            width: 100%;
            margin: 0;
            padding: 14px 20px;
            font-size: 1.1em;
            background: rgba(255,255,255,0.09);
        }

        .mobile-menu img {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        .mobile-menu .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .close-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }

        @media (max-height: 760px) {
            .logo {
                max-width: min(40vw, 280px);
                max-height: min(32vh, 220px);
            }

            .nav-item img {
                width: min(100%, 16vw, 18vh, 110px);
                max-height: min(18vh, 110px);
            }
        }

        @media (max-width: 900px) and (min-width: 769px) {
            .navigation {
                gap: clamp(8px, 1.6vw, 18px);
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .nav-label {
                font-size: clamp(0.68rem, 1.4vw, 0.9rem);
            }
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            html, body {
                overflow: auto;
                height: auto;
            }

            .home-shell {
                height: auto;
                min-height: 100dvh;
                justify-content: flex-start;
                padding-top: 12vh;
                overflow: visible;
            }

            .navigation {
                display: none;
            }

            .hamburger-menu {
                display: block;
            }

            .logo {
                width: min(72vw, 38vh, 280px);
            }
        }
    </style>
    <link rel="stylesheet" href="/fit-screen.css">
</head>

<body>

    <div class="navigation">

    <!-- Tracker submenu overlay -->
    <div class="tracker-overlay" id="trackerOverlay" onclick="closeTrackerMenu(event)">

        <div class="tracker-overlay-title">

    <!-- Hamburger menu icon -->
    <div class="hamburger-menu" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu" onclick="toggleMenu()">✕</div>

        <a href="Chatbot.html">SailBot</a>
        <a href="SailScan.html">Photos</a>
        <a href="Find-regatta.html">Regatta Search</a>
        <div class="mobile-group">
            <button class="mobile-tracker-toggle" id="trackerToggle" onclick="toggleTrackerSub()">
                Tracker <span class="arrow">▶</span>
            </button>
            <div class="mobile-tracker-sub" id="trackerSub">
                <a href="Tracker.html">Web Tracker</a>
                <a href="Tracker-dashboard.html">Track Dashboard</a>
                <a href="PiControl.html">Pi Control</a>
            </div>
        </div>
        <a href="Shop.html">Shopping</a>
        <a href="RacePlanner.html">Race Planner</a>
    </div>

    <script>
        function toggleMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            mobileMenu.style.display = mobileMenu.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleTrackerSub() {
            const btn = document.getElementById('trackerToggle');
            const sub = document.getElementById('trackerSub');
            btn.classList.toggle('open');
            sub.classList.toggle('open');
        }

        function openTrackerMenu() {
            document.getElementById('trackerOverlay').classList.add('open');
        }

        function closeTrackerMenu(e) {
            // Close if clicking the backdrop or the X, not the buttons/image
            if (!e || e.target === document.getElementById('trackerOverlay') || e.target.classList.contains('tracker-overlay-close')) {
                document.getElementById('trackerOverlay').classList.remove('open');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeTrackerMenu();
        });
    </script>
</body>

</html>
