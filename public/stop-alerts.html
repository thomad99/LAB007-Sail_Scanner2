<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Love Sailing</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #071433;
            --navy-deep: #04102b;
            --blue: #1d4ed8;
            --blue-hover: #1e40af;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --page: #f8fafc;
            --card-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
            --radius: 20px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
            min-height: 100vh;
        }

        a { color: inherit; }

        button, input {
            font-family: inherit;
        }

        .site-header {
            background: var(--navy-deep);
            color: #fff;
        }

        .header-inner,
        .hero-inner,
        .page-inner {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 72px;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .brand img {
            height: 56px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
            object-position: left center;
        }

        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .desktop-nav a {
            color: #dbe4f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        .desktop-nav a.active {
            color: #fff;
            border-bottom-color: #60a5fa;
        }

        .hero {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(100deg, rgba(4, 16, 43, 0.94) 0%, rgba(4, 16, 43, 0.72) 42%, rgba(4, 16, 43, 0.28) 100%),
                url("/Images/Gemini_Generated_Image_8bt7028bt7028bt7.png") right center / cover no-repeat,
                linear-gradient(180deg, var(--navy-deep), #0b2a5c);
            color: #fff;
            padding: 36px 0 88px;
        }

        .hero-inner h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            max-width: 14ch;
            line-height: 1.1;
        }

        .hero-script {
            position: absolute;
            right: 7%;
            bottom: 34%;
            margin: 0;
            font-family: Caveat, "Segoe Script", cursive;
            font-size: clamp(1.4rem, 2.4vw, 2rem);
            color: rgba(255, 255, 255, 0.9);
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .page {
            background: var(--page);
            padding: 0 0 64px;
            min-height: 40vh;
        }

        .search-card {
            position: relative;
            margin-top: -56px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 22px;
        }

        .card-tabs {
            display: flex;
            gap: 4px;
            margin: -6px 0 18px;
            border-bottom: 1px solid var(--line);
        }

        .card-tab {
            display: inline-block;
            padding: 10px 16px 12px;
            margin-bottom: -1px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            border-bottom: 2px solid transparent;
        }

        .card-tab.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        .muted {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin: 14px 0 8px;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 14px;
            font-size: 0.95rem;
            border-radius: 12px;
            border: 1px solid var(--line);
            color: var(--ink);
        }

        input:focus {
            outline: none;
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            min-height: 46px;
            padding: 0 18px;
            border-radius: 12px;
            border: 0;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            background: #b91c1c;
            color: #fff;
        }

        button.secondary {
            background: var(--blue);
        }

        button.secondary:hover {
            background: var(--blue-hover);
        }

        .status {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            display: none;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .status.active { display: block; }
        .status.ok { background: #ecfdf5; color: #166534; }
        .status.err { background: #fef2f2; color: #991b1b; }

        .watch-list { margin-top: 20px; }

        .watch-item {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
            padding: 18px 20px;
            margin-bottom: 12px;
        }

        .watch-item a {
            color: var(--blue);
            font-weight: 600;
            text-decoration: none;
        }

        .empty-state {
            text-align: center;
            padding: 28px 16px;
            color: var(--muted);
        }

        .empty-state h2 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 1.25rem;
        }

        @media (max-width: 768px) {
            .header-inner,
            .hero-inner,
            .page-inner {
                width: min(1120px, calc(100% - 28px));
            }

            .desktop-nav { display: none; }
            .hero-script { display: none; }
            .hero { padding: 24px 0 72px; }
        }
    </style>
    <link rel="stylesheet" href="/fit-screen.css">
</head>

<body class="fit-app">
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html">
                <img src="/Images/LoveSailing-Left.jpg" alt="Love Sailing">
            </a>
            <nav class="desktop-nav" aria-label="Find regatta sections">
                <a href="Find-regatta.html">Find regattas</a>
                <a href="Find-regatta.html#alerts" class="active">Alerts</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-inner">
            <h1>Your results alerts.</h1>
            <p class="hero-script">More Sailing Together</p>
        </div>
    </section>

    <main class="page">
        <div class="page-inner">
            <section class="search-card">
                <div class="card-tabs">
                    <a class="card-tab" href="Find-regatta.html">Find regattas</a>
                    <a class="card-tab active" href="Find-regatta.html#alerts">Alerts</a>
                </div>
                <p class="muted">Alerts on this page are only the ones for the stop link you opened. Other people’s alerts are never shown.</p>
                <div id="status" class="status"></div>
                <div class="watch-list" id="watchList"></div>
                <div class="actions">
                    <a class="secondary" href="Find-regatta.html#alerts" id="manageLink" style="display:inline-flex;align-items:center;text-decoration:none;background:#1d4ed8;color:#fff;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;">Manage my alerts</a>
                </div>
            </section>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = (params.get('token') || '').trim();
        const statusEl = document.getElementById('status');
        const watchList = document.getElementById('watchList');

        function setStatus(message, ok) {
            statusEl.textContent = message;
            statusEl.className = 'status active ' + (ok ? 'ok' : 'err');
        }

        function forgetStoredToken(stopToken, resultsUrl) {
            try {
                const state = JSON.parse(localStorage.getItem('ls-results-watches') || '{}');
                const items = state.items || {};
                Object.keys(items).forEach(url => {
                    const val = items[url];
                    const stored = typeof val === 'string' ? val : val && val.token;
                    if (stored === stopToken || (resultsUrl && url === resultsUrl)) delete items[url];
                });
                state.items = items;
                localStorage.setItem('ls-results-watches', JSON.stringify(state));
            } catch (_err) { /* ignore */ }
        }

        if (!token) {
            window.location.replace('Find-regatta.html#alerts');
        } else {
            fetch('/api/results-watch/stop?token=' + encodeURIComponent(token))
                .then(async response => {
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok || data.error) throw new Error(data.error || 'Could not stop this alert.');
                    const name = data.watch && data.watch.regatta_name ? data.watch.regatta_name : 'this race';
                    const resultsUrl = data.watch && data.watch.results_url;
                    forgetStoredToken(token, resultsUrl);
                    setStatus('Alerts stopped for ' + name + '.', true);
                    watchList.innerHTML = '<div class="empty-state"><h2>Alert stopped</h2><p>You can manage any remaining alerts from this device on the Alerts tab.</p></div>';
                })
                .catch(err => {
                    setStatus(err.message, false);
                    watchList.innerHTML = '<div class="empty-state"><h2>Could not stop this alert</h2><p>Open the Alerts tab on this device to manage alerts you set here.</p></div>';
                });
        }
    </script>
</body>

</html>
