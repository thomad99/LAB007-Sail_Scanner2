<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SailBot – Love Sailing</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta property="og:title" content="SailBot – Love Sailing">
    <meta property="og:description" content="Ask about ClubSpot and Regatta Network race results.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lovesailing.ai/Chatbot.html">
    <meta property="og:image" content="https://lovesailing.ai/Images/LoveSailing-Left.jpg">
    <meta property="og:image:alt" content="Love Sailing Logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SailBot – Love Sailing">
    <meta name="twitter:description" content="Ask about ClubSpot and Regatta Network race results.">
    <meta name="twitter:image" content="https://lovesailing.ai/Images/LoveSailing-Left.jpg">
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100dvh;
            background: #eaf0f8;
            color: #152033;
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .site-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 22px;
            background: #04102b;
            border-bottom: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .brand img {
            height: 44px;
            width: auto;
            max-width: 48px;
            object-fit: contain;
            object-position: center;
            background: transparent;
        }

        .brand span {
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .nav-link {
            color: #dbe4f0;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #fff;
        }

        .page {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            padding: clamp(8px, 1.6vh, 16px) 16px;
        }

        .messenger {
            width: min(560px, 100%);
            height: 100%;
            max-height: none;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(21, 40, 80, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .bot-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #0d3b8e;
            color: #fff;
        }

        .bot-stats {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .bot-stat {
            text-align: right;
            line-height: 1.15;
        }

        .bot-stat strong {
            display: block;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .bot-stat span {
            display: block;
            font-size: 0.64rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.78;
        }

        .bot-id {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .bot-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #fff;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .bot-avatar img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            background: transparent;
        }

        .bot-id strong {
            display: block;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .bot-id span {
            display: block;
            font-size: 0.78rem;
            opacity: 0.82;
            font-weight: 400;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.12); }
        .icon-btn svg { width: 18px; height: 18px; }

        .chat-pane {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px 16px 8px;
            background: #fff;
        }

        .msg {
            max-width: 86%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.45;
            font-size: 0.94rem;
        }

        .msg.bot {
            background: #eef2f6;
            color: #1b2433;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .msg.user {
            background: #2f6bff;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            border: 1px solid #d5deea;
            background: #fff;
            color: #35507a;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }

        .chip:hover { border-color: #2f6bff; color: #2f6bff; }

        .msg.bot .results-card {
            margin-top: 10px;
            background: #eef3f8;
            border-radius: 14px;
            padding: 14px 15px 12px;
            color: #1a1a2e;
            text-align: left;
        }

        .msg.wide .results-card.sailor-card {
            background: #fff;
            padding: 16px 16px 14px;
            box-shadow: 0 8px 24px rgba(21, 40, 80, 0.08);
        }

        .sailor-profile-name {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #14213d;
        }

        .sailor-profile-club {
            margin: 2px 0 14px;
            color: #7a879a;
            font-size: 0.92rem;
        }

        .sailor-highlights {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .sailor-highlight {
            background: #fff;
            border: 1px solid #e6edf5;
            border-radius: 12px;
            padding: 10px 6px 9px;
            text-align: center;
        }

        .sailor-highlight strong {
            display: block;
            font-size: 1.22rem;
            font-weight: 800;
            color: #163a8a;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .sailor-highlight span {
            display: block;
            margin-top: 4px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #8a96a8;
            line-height: 1.2;
        }

        .sailor-tile {
            background: #f4f8ff;
            border-radius: 12px;
            padding: 12px 14px 13px;
            margin-bottom: 12px;
        }

        .sailor-tile-kicker {
            margin: 0 0 10px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8a96a8;
        }

        .podium-stand {
            display: grid;
            grid-template-columns: 1fr 1.15fr 1fr;
            align-items: end;
            gap: 8px;
            min-height: 148px;
        }

        .podium-col {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-width: 0;
        }

        .podium-tile {
            border-radius: 12px 12px 0 0;
            padding: 10px 6px 8px;
            text-align: center;
        }

        .podium-tile .medal {
            display: block;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .podium-tile strong {
            display: block;
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.05;
            margin: 4px 0 2px;
        }

        .podium-tile .place {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .podium-riser {
            border-radius: 0 0 10px 10px;
        }

        .podium-col.silver .podium-tile {
            background: linear-gradient(180deg, #f4f6f8 0%, #d5dbe3 100%);
            color: #4b5563;
        }
        .podium-col.silver .podium-riser {
            height: 36px;
            background: #c5ccd6;
        }

        .podium-col.gold .podium-tile {
            background: linear-gradient(180deg, #ffe9a3 0%, #e4b123 100%);
            color: #7a5200;
        }
        .podium-col.gold .podium-riser {
            height: 58px;
            background: #d4a017;
        }

        .podium-col.bronze .podium-tile {
            background: linear-gradient(180deg, #f3d3b3 0%, #c07a3a 100%);
            color: #6a3a12;
        }
        .podium-col.bronze .podium-riser {
            height: 24px;
            background: #a86328;
        }

        .podium-note {
            margin: 8px 0 0;
            font-size: 0.72rem;
            color: #93a0b3;
        }

        .race-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .race-stat {
            background: #fff;
            border: 1px solid #e6edf5;
            border-radius: 12px;
            padding: 10px 6px 9px;
            text-align: center;
        }

        .race-stat strong {
            display: block;
            font-size: 1.15rem;
            font-weight: 800;
            color: #163a8a;
            letter-spacing: -0.03em;
        }

        .race-stat span {
            display: block;
            margin-top: 4px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #8a96a8;
            line-height: 1.2;
        }

        .best-result-tile {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px;
            align-items: center;
        }

        .best-result-place {
            min-width: 52px;
            text-align: center;
        }

        .best-result-place .kicker {
            display: block;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8a96a8;
            margin-bottom: 2px;
        }

        .best-result-place strong {
            font-size: 1.45rem;
            font-weight: 800;
            color: #d4a017;
            letter-spacing: -0.03em;
        }

        .best-result-copy .name-link {
            color: #163a8a;
            font-weight: 800;
            text-decoration: none;
            font-size: 0.98rem;
            text-align: left;
        }

        .best-result-copy .meta {
            margin-top: 2px;
            color: #7a879a;
            font-size: 0.82rem;
        }

        .sailor-results-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin: 4px 2px 6px;
        }

        .sailor-results-head h3 {
            margin: 0;
            font-size: 1.02rem;
            color: #163a8a;
            text-decoration: none;
        }

        .sailor-results-head .sort-note {
            font-size: 0.78rem;
            font-weight: 600;
            color: #3b82f6;
        }

        .sailor-event-list {
            border-top: 1px solid #edf1f6;
        }

        .sailor-event {
            display: grid;
            grid-template-columns: 58px minmax(0, 1fr) auto;
            gap: 8px;
            align-items: start;
            padding: 11px 2px;
            border-bottom: 1px solid #edf1f6;
        }

        .sailor-event.hidden-event {
            display: none;
        }

        .sailor-event-list.expanded .sailor-event.hidden-event {
            display: grid;
        }

        .sailor-event-place {
            font-size: 0.98rem;
            font-weight: 800;
            color: #163a8a;
            padding-top: 1px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .sailor-event-place.gold { color: #d4a017; }
        .sailor-event-place.silver { color: #8b95a3; }
        .sailor-event-place.bronze { color: #c07a3a; }

        .sailor-event-name {
            font-weight: 800;
            color: #163a8a;
            font-size: 0.92rem;
            text-align: left;
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .sailor-event-meta {
            margin-top: 2px;
            color: #7a879a;
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .sailor-event-photos {
            align-self: center;
        }

        .photo-link.labeled {
            width: auto;
            height: auto;
            padding: 4px 2px;
            gap: 4px;
            color: #5b6b80;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .photo-link.labeled span {
            display: none;
        }

        @media (min-width: 420px) {
            .photo-link.labeled span {
                display: inline;
            }
        }

        .sailor-event-detail {
            display: none;
            grid-column: 1 / -1;
            margin: 4px 0 2px;
            padding: 10px 12px;
            background: #f4f8ff;
            border: 1px solid #d5e4ff;
            border-radius: 8px;
            font-size: 0.88em;
        }

        .sailor-event-detail.open {
            display: block;
        }

        .sailor-results-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
            color: #8a96a8;
            font-size: 0.78rem;
        }

        .sailor-results-foot .js-show-more,
        .sailor-results-foot .js-download-results {
            border: none;
            background: none;
            color: #3b82f6;
            font-weight: 700;
            font-size: 0.82rem;
            padding: 0;
            cursor: pointer;
        }

        .msg.wide {
            max-width: 100%;
            padding: 0;
            background: transparent;
        }

        .msg.wide .results-card {
            margin-top: 0;
            width: 100%;
        }

        .results-card h3 {
            margin: 0 0 12px;
            color: #0066cc;
            font-size: 1em;
            text-decoration: underline;
            text-decoration-color: #0066cc;
        }

        .results-card .sailor-results-head h3 {
            margin: 0;
            color: #163a8a;
            font-size: 1.02rem;
            text-decoration: none;
        }

        .results-card .basic-info table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        .results-card .basic-info td {
            padding: 6px 10px 6px 0;
            vertical-align: top;
        }

        .results-card .basic-info td:first-child {
            font-weight: 600;
            color: #333;
            width: 1%;
            white-space: nowrap;
        }

        .results-card table.data {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .results-card table.data th,
        .results-card table.data td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .results-card table.data th {
            background: #f0f4ff;
            color: #0066cc;
            font-weight: 600;
        }

        .results-card table.data th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .results-card table.data th.sortable:hover {
            background: #e4edff;
        }

        .results-card table.data th.sortable.sort-asc::after {
            content: '▲';
            font-size: 0.75em;
            margin-left: 4px;
        }

        .results-card table.data th.sortable.sort-desc::after {
            content: '▼';
            font-size: 0.75em;
            margin-left: 4px;
        }

        .results-card table.data tbody tr:nth-child(even) {
            background: #f7fbff;
        }

        .results-card .pos-link,
        .results-card .name-link {
            background: none;
            border: none;
            color: #0066cc;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: inherit;
            text-align: left;
        }

        .results-card .sailor-event-place {
            color: #163a8a;
            text-decoration: none;
            font-weight: 800;
        }

        .results-card .sailor-event-place.gold { color: #d4a017; }
        .results-card .sailor-event-place.silver { color: #8b95a3; }
        .results-card .sailor-event-place.bronze { color: #c07a3a; }

        .results-card .sailor-event-name {
            color: #163a8a;
            text-decoration: none;
            font-weight: 800;
        }

        .results-card .pos-link:hover,
        .results-card .name-link:hover {
            color: #0088ff;
        }

        .photo-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            margin-left: 6px;
            vertical-align: middle;
            color: #0d3b8e;
            border-radius: 6px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .photo-link:hover {
            background: #e8f0ff;
            color: #0066cc;
        }

        .photo-link svg {
            width: 16px;
            height: 16px;
        }

        .results-card .sailor-title {
            margin: 0 0 14px;
            color: #0066cc;
            font-size: 1.15em;
            text-decoration: none;
        }

        .results-card .detail-panel {
            display: none;
            margin: 8px 0 12px;
            padding: 12px;
            background: #f4f8ff;
            border: 1px solid #d5e4ff;
            border-radius: 8px;
            font-size: 0.88em;
        }

        .results-card .detail-panel.open {
            display: block;
        }

        .results-card tr.detail-row > td {
            padding: 0;
            border-bottom: none;
        }

        .results-card .race-cells {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .results-card .race-cell {
            background: #e8f1ff;
            border-radius: 6px;
            padding: 4px 8px;
            font-variant-numeric: tabular-nums;
        }

        .results-card .race-cell.best {
            background: #d8ffe8;
            font-weight: 700;
        }

        .results-card .section {
            margin-bottom: 18px;
        }

        .event-modal {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(10, 16, 40, 0.55);
        }

        .event-modal.open {
            display: flex;
        }

        .event-modal-card {
            width: min(960px, 100%);
            max-height: 86vh;
            overflow: auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px 22px;
            color: #1a1a2e;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
        }

        .event-modal-card h3 {
            margin: 0 0 6px;
            color: #0066cc;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .event-modal-meta {
            margin: 0 0 14px;
            color: #445;
            font-size: 0.9em;
        }

        .event-modal-close {
            float: right;
            border: none;
            background: #eef3ff;
            color: #0066cc;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .event-modal-toolbar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin: 0 0 14px;
            padding: 12px;
            background: #f4f7ff;
            border-radius: 8px;
        }

        .event-modal-toolbar label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75em;
            font-weight: 700;
            color: #0066cc;
        }

        .event-modal-toolbar select {
            padding: 7px 8px;
            border: 1px solid #c9d6ee;
            border-radius: 6px;
            background: #fff;
            color: #1a1a2e;
            font-size: 0.9em;
        }

        @media (max-width: 640px) {
            .event-modal-toolbar {
                grid-template-columns: 1fr;
            }
        }

        .results-card .section:last-child {
            margin-bottom: 0;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 10px 18px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: #0088ff;
        }

        .btn-download svg {
            width: 18px;
            height: 18px;
        }

        .composer {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px 6px;
        }

        .composer input {
            flex: 1;
            border: 1px solid #d7e0ea;
            background: #f7f9fc;
            border-radius: 999px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #152033;
        }

        .composer input::placeholder { color: #8b97a8; }
        .composer input:focus {
            outline: none;
            border-color: #2f6bff;
            background: #fff;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #2f6bff;
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;

        .send-btn:hover:not(:disabled) { background: #1f58e6; }

        .status {
            min-height: 16px;
            font-size: 0.75rem;

        .status.err { color: #c0392b; }

        .markdown {

        @media (max-width: 768px) {

            .msg { max-width: 92%; }
            .bot-stats { gap: 10px; }
            .bot-stat strong { font-size: 0.82rem; }
            .bot-id span { display: none; }
            .composer {
                padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));

    </style>

        @media (max-width: 768px) {

            body.fit-app {

</head>

<body class="fit-app">
    <header class="site-bar">
        <a class="brand" href="index.html">
            <img src="/Images/Sail_Logo_Trans.PNG" alt="">
            <span>Love Sailing</span>
        </a>
        <a class="nav-link" href="Find-regatta.html">Regattas</a>
    </header>
    <main class="page">
        <section class="messenger">
            <header class="bot-bar">
                <div class="bot-id">
                    <div class="bot-avatar" aria-hidden="true">
                        <img src="/Images/Sail_Logo_Trans.PNG" alt="">
                    </div>
                    <div>
                        <strong>SailBot</strong>
                        <span>Love Sailing assistant</span>
                    </div>
                </div>
                <div class="bot-stats" id="botStats" aria-live="polite">
                    <div class="bot-stat">
                        <strong id="sailorCount">—</strong>
                        <span>sailors</span>
                    </div>
                    <div class="bot-stat">
                        <strong id="regattaCount">—</strong>
                        <span>regattas</span>
                    </div>
                </div>
                <button type="button" class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="4" width="14" height="16" rx="2"></rect>
                        <path d="M9 9h6M9 13h4"></path>
                    </svg>
                </button>
            </header>
            <div class="chat-pane" id="chatPane"></div>
            <div class="composer">
                <input type="text" id="input" placeholder="Type your question..." autocomplete="off">
                <button type="button" class="send-btn" id="sendBtn" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2 11 13"></path>
                        <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
                    </svg>
                </button>
            </div>
            <div class="status" id="status"></div>
        </section>
    </main>

    <script>
        const chatPane = document.getElementById('chatPane');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        function welcomeHtml() {
            return '<div class="msg bot" id="welcome">' +
                'Hi! What would you like to explore?' +
                '<div class="chips">' +
                '<button type="button" class="chip" data-prompt="show sailor results">Sailor results</button>' +
                '</div></div>';
        }

        function resetChat() {
            chatPane.innerHTML = welcomeHtml();
            status.textContent = '';
            status.className = 'status';
            input.value = '';
            input.focus();
        }

        resetChat();

        function formatCount(value) {
            const n = Number(value || 0);
            return Number.isFinite(n) ? n.toLocaleString() : '—';
        }

        async function loadHeaderStats() {
            try {
                const res = await fetch('/api/race-results/stats');
                const data = await res.json();
                if (!data || !data.success) return;
                document.getElementById('sailorCount').textContent = formatCount(data.total_sailors);
                document.getElementById('regattaCount').textContent = formatCount(data.total_regattas);
            } catch (_err) {
                /* leave placeholders */
            }
        }

        loadHeaderStats();

        function addMsg(content, isUser) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'user' : 'bot');
            div.textContent = content;
            chatPane.appendChild(div);
            chatPane.scrollTop = chatPane.scrollHeight;
        }

        function simpleMarkdown(s) {
            return s
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function photoSearchHref(name) {
            if (!name) return '';
            return 'PhotoSearch.html?' + new URLSearchParams({ regatta_name: name }).toString();
        }

        function photoLinkHtml(name, _date, labeled) {
            const href = photoSearchHref(name);
            if (!href) return '';
            return '<a class="photo-link' + (labeled ? ' labeled' : '') + '" href="' + href + '" target="_blank" rel="noopener" title="Photos from this regatta" aria-label="Photos from ' +
                escapeHtml(name) + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
                '<path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>' +
                (labeled ? '<span>Photos</span>' : '') + '</a>';
        }

        function displayLoc(value) {
            const t = String(value == null ? '' : value).trim();
            return t && t !== '—' ? t : '—';
        }

        function formatChatDateLocal(isoOrText) {
            if (!isoOrText) return '—';
            const s = String(isoOrText).slice(0, 10);
            const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return String(isoOrText);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return parseInt(m[3], 10) + ' ' + months[parseInt(m[2], 10) - 1] + ' ' + m[1];
        }

        function sortPairsFromTable(table) {
            const tbody = table.tBodies[0];
            if (!tbody) return [];
            const pairs = [];
            Array.from(tbody.children).forEach(tr => {
                if (tr.classList.contains('detail-row')) {
                    if (pairs.length) pairs[pairs.length - 1].detail = tr;
                    return;
                }
                pairs.push({ row: tr, detail: null });
            });
            return pairs;
        }

        function compareSortValues(a, b, type) {
            if (type === 'num') {
                const an = Number(a);
                const bn = Number(b);
                const aOk = Number.isFinite(an);
                const bOk = Number.isFinite(bn);
                if (aOk && bOk && an !== bn) return an - bn;
                if (aOk !== bOk) return aOk ? -1 : 1;
                return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
            }
            return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
        }

        function applyTableSort(table, key, dir) {
            const tbody = table.tBodies[0];
            if (!tbody) return;
            const header = table.querySelector('th[data-sort="' + key + '"]');
            const type = (header && header.getAttribute('data-type')) || 'text';
            const pairs = sortPairsFromTable(table);
            pairs.sort((x, y) => {
                const av = x.row.getAttribute('data-' + key) || '';
                const bv = y.row.getAttribute('data-' + key) || '';
                const cmp = compareSortValues(av, bv, type);
                return dir === 'desc' ? -cmp : cmp;
            });
            pairs.forEach(p => {
                tbody.appendChild(p.row);
                if (p.detail) tbody.appendChild(p.detail);
            });
            table.querySelectorAll('th.sortable').forEach(th => {
                th.classList.toggle('sort-asc', th.getAttribute('data-sort') === key && dir === 'asc');
                th.classList.toggle('sort-desc', th.getAttribute('data-sort') === key && dir === 'desc');
            });
            table.dataset.sortKey = key;
            table.dataset.sortDir = dir;
        }

        function wireSortableTable(table, defaultKey, defaultDir) {
            if (!table) return;
            applyTableSort(table, defaultKey, defaultDir);
            table.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const key = th.getAttribute('data-sort');
                    const same = table.dataset.sortKey === key;
                    const next = same
                        ? (table.dataset.sortDir === 'asc' ? 'desc' : 'asc')
                        : (th.getAttribute('data-default-dir') || 'asc');
                    applyTableSort(table, key, next);
                });
            });
        }

        function renderDetailHtml(detail) {
            if (!detail) return '<em>No detail available.</em>';
            const cells = detail.resultsCells || [];
            const best = cells.reduce((min, c) => (c.place != null && (min == null || c.place < min) ? c.place : min), null);
            let html = '<div><strong>' + escapeHtml(detail.regatta_name || 'Regatta') + '</strong> · ' + escapeHtml(formatChatDateLocal(detail.regatta_date)) + '</div>';
            html += '<div style="margin-top:6px;">Class: ' + escapeHtml(detail.category || '—') + ' · Overall place: ' + escapeHtml(String(detail.position ?? '—')) + ' · Points: ' + escapeHtml(String(detail.total_points ?? '—')) + '</div>';
            html += '<div style="margin-top:6px;">Sail: ' + escapeHtml(detail.sail_number || '—') + ' · Boat: ' + escapeHtml(detail.boat_name || '—') + ' · Club: ' + escapeHtml(detail.yacht_club || '—') + '</div>';
            if (cells.length) {
                html += '<div class="race-cells">';
                cells.forEach(c => {
                    const cls = c.place != null && c.place === best ? 'race-cell best' : 'race-cell';
                    html += '<span class="' + cls + '">R' + c.index + ': ' + escapeHtml(c.raw) + '</span>';
                });
                html += '</div>';
            } else if (detail.results) {
                html += '<div style="margin-top:8px;">Race scores: ' + escapeHtml(detail.results) + '</div>';
            }
            if (detail.source_url) {
                html += '<div style="margin-top:8px;"><a href="' + escapeHtml(detail.source_url) + '" target="_blank" rel="noopener">Open source results</a></div>';
            }
            return html;
        }

        function ordinal(n) {
            const num = parseInt(n, 10);
            if (!Number.isFinite(num)) return '—';
            const v = Math.abs(num) % 100;
            const d = Math.abs(num) % 10;
            const suf = (v > 10 && v < 14) ? 'th' : (d === 1 ? 'st' : d === 2 ? 'nd' : d === 3 ? 'rd' : 'th');
            return num + suf;
        }

        function bestRegattaRow(data) {
            const rows = data.regattaAchievements || [];
            const best = data.summary && data.summary.bestRegattaPlace;
            const scored = rows.filter(r => /^\d+$/.test(String(r.position || '').trim()));
            scored.sort((a, b) => parseInt(a.position, 10) - parseInt(b.position, 10));
            if (best != null) {
                const match = scored.find(r => parseInt(r.position, 10) === Number(best));
                if (match) return match;
            }
            return scored[0] || rows[0] || null;
        }

        function placeTone(n) {
            if (n === 1) return 'gold';
            if (n === 2) return 'silver';
            if (n === 3) return 'bronze';
            return '';
        }

        function renderSailorCardHtml(data) {
            const sailor = data.sailor || {};
            const summary = data.summary || {};
            const podiums = summary.podiums || {};
            const best = bestRegattaRow(data);
            const regattaRows = data.regattaAchievements || [];
            const shown = 6;
            const total = regattaRows.length;
            const totalRegattas = Number(summary.totalRegattas ?? total);
            const races = summary.races || {};
            const firsts = Number(podiums.first || 0);
            const seconds = Number(podiums.second || 0);
            const thirds = Number(podiums.third || 0);
            const totalRaces = Number(races.total || 0);
            const raceWins = Number(races.wins || 0);
            const raceAvg = races.average != null ? races.average : null;

            let html = '<div class="sailor-profile">';
            html += '<p class="sailor-profile-name">' + escapeHtml(sailor.name || 'Sailor') + '</p>';
            html += '<p class="sailor-profile-club">' + escapeHtml(sailor.club || '') + '</p>';
            html += '<div class="sailor-highlights">';
            html += '<div class="sailor-highlight"><strong>' + escapeHtml(String(totalRegattas)) + '</strong><span>Regattas</span></div>';
            html += '<div class="sailor-highlight"><strong>' + escapeHtml(ordinal(summary.bestRegattaPlace)) + '</strong><span>Best Regatta</span></div>';
            html += '<div class="sailor-highlight"><strong>' + escapeHtml(ordinal(summary.bestRacePlace)) + '</strong><span>Best Race Position</span></div>';
            html += '</div>';

            html += '<div class="sailor-tile">';
            html += '<p class="sailor-tile-kicker">Regatta podiums</p>';
            html += '<div class="podium-stand">';
            html += '<div class="podium-col silver"><div class="podium-tile"><span class="medal">Silver</span><strong>' + escapeHtml(String(seconds)) + '</strong><span class="place">2nd place</span></div><div class="podium-riser"></div></div>';
            html += '<div class="podium-col gold"><div class="podium-tile"><span class="medal">Gold</span><strong>' + escapeHtml(String(firsts)) + '</strong><span class="place">1st place</span></div><div class="podium-riser"></div></div>';
            html += '<div class="podium-col bronze"><div class="podium-tile"><span class="medal">Bronze</span><strong>' + escapeHtml(String(thirds)) + '</strong><span class="place">3rd place</span></div><div class="podium-riser"></div></div>';
            html += '</div>';
            if (Number(podiums.missing || 0) > 0) {
                html += '<p class="podium-note">Counts pending complete results</p>';
            }
            html += '</div>';

            html += '<div class="race-stats">';
            html += '<div class="race-stat"><strong>' + escapeHtml(String(totalRaces)) + '</strong><span>Total Races</span></div>';
            html += '<div class="race-stat"><strong>' + escapeHtml(String(raceWins)) + '</strong><span>Total Race Wins</span></div>';
            html += '<div class="race-stat"><strong>' + escapeHtml(raceAvg == null ? '—' : String(raceAvg)) + '</strong><span>Average Position</span></div>';
            html += '</div>';

            if (best) {
                const bestPlace = parseInt(best.position, 10);
                html += '<div class="sailor-tile best-result-tile">';
                html += '<div class="best-result-place"><span class="kicker">Best result</span><strong>' + escapeHtml(ordinal(bestPlace)) + '</strong></div>';
                html += '<div class="best-result-copy"><button type="button" class="name-link" data-regatta-name="' + escapeHtml(best.regatta_name || '') +
                    '" data-regatta-date="' + escapeHtml(best.regatta_date_raw || '') + '">' +
                    escapeHtml(best.regatta_name || '') + '</button>';
                html += '<div class="meta">' + escapeHtml(best.regatta_date || '') +
                    (best.category ? ' · ' + escapeHtml(best.category) : '') + '</div></div></div>';
            }

            html += '<div class="sailor-results-head"><h3>Regatta results</h3><span class="sort-note">Newest first</span></div>';
            html += '<div class="sailor-event-list js-event-list">';
            if (regattaRows.length) {
                regattaRows.forEach((r, idx) => {
                    const placeNum = parseInt(String(r.position || '').replace(/[^\d]/g, ''), 10);
                    const tone = placeTone(placeNum);
                    const loc = displayLoc(r.location);
                    html += '<div class="sailor-event' + (idx >= shown ? ' hidden-event' : '') + '">';
                    html += '<button type="button" class="pos-link sailor-event-place' + (tone ? ' ' + tone : '') + '" data-detail="' + escapeHtml(r.detailId) + '">' +
                        escapeHtml(ordinal(placeNum)) + '</button>';
                    html += '<div><button type="button" class="sailor-event-name name-link" data-regatta-name="' + escapeHtml(r.regatta_name || '') +
                        '" data-regatta-date="' + escapeHtml(r.regatta_date_raw || '') + '">' + escapeHtml(r.regatta_name || '') + '</button>';
                    html += '<div class="sailor-event-meta">' + escapeHtml(r.regatta_date || '') +
                        (r.category ? ' · ' + escapeHtml(r.category) : '') +
                        (loc ? '<br>' + escapeHtml(loc) : '') + '</div></div>';
                    html += '<div class="sailor-event-photos">' + photoLinkHtml(r.regatta_name, r.regatta_date_raw, true) + '</div>';
                    html += '<div class="sailor-event-detail detail-panel" data-detail-panel="' + escapeHtml(r.detailId) + '"></div>';
                    html += '</div>';
                });
            } else {
                html += '<div class="sailor-event"><div class="sailor-event-meta">No regatta results yet.</div></div>';
            }
            html += '</div>';
            html += '<div class="sailor-results-foot"><span>Showing ' + Math.min(shown, total) + ' of ' + total + ' regattas</span>';
            if (total > shown) {
                html += '<button type="button" class="js-show-more">Show more</button>';
            } else {
                html += '<button type="button" class="js-download-results">Download</button>';
            }
            html += '</div></div>';
            return html;
        }

        function wireSailorCard(cardEl, data) {
            const details = data.details || {};
            cardEl.querySelectorAll('.pos-link').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-detail');
                    const row = btn.closest('.sailor-event');
                    let panel = row ? row.querySelector('.detail-panel[data-detail-panel="' + id + '"]') : null;
                    if (!panel) panel = cardEl.querySelector('.detail-panel[data-detail-panel="' + id + '"]');
                    if (!panel) return;
                    const opening = !panel.classList.contains('open');
                    cardEl.querySelectorAll('.detail-panel.open').forEach(p => {
                        if (p !== panel) p.classList.remove('open');
                    });
                    if (opening) {
                        panel.innerHTML = renderDetailHtml(details[id]);
                        panel.classList.add('open');
                    } else {
                        panel.classList.remove('open');
                    }
                });
            });
            cardEl.querySelectorAll('.name-link').forEach(btn => {
                btn.addEventListener('click', () => {
                    openRegattaEventCard(btn.getAttribute('data-regatta-name'), btn.getAttribute('data-regatta-date'));
                });
            });
            const list = cardEl.querySelector('.js-event-list');
            const moreBtn = cardEl.querySelector('.js-show-more');
            const foot = cardEl.querySelector('.sailor-results-foot span');
            const total = (data.regattaAchievements || []).length;
            if (moreBtn && list) {
                moreBtn.addEventListener('click', () => {
                    const open = list.classList.toggle('expanded');
                    moreBtn.textContent = open ? 'Show less' : 'Show more';
                    if (foot) foot.textContent = open
                        ? ('Showing ' + total + ' of ' + total + ' regattas')
                        : ('Showing ' + Math.min(6, total) + ' of ' + total + ' regattas');
                });
            }
        }

        function ensureEventModal() {
            let modal = document.getElementById('regattaEventModal');
            if (modal) return modal;
            modal = document.createElement('div');
            modal.id = 'regattaEventModal';
            modal.className = 'event-modal';
            modal.innerHTML = '<div class="event-modal-card results-card" role="dialog" aria-modal="true"><button type="button" class="event-modal-close">Close</button><div class="js-event-body"></div></div>';
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
            modal.querySelector('.event-modal-close').addEventListener('click', () => modal.classList.remove('open'));
            document.body.appendChild(modal);
            return modal;
        }

        function uniqueEventOptions(rows, key) {
            const map = new Map();
            (rows || []).forEach(r => {
                const raw = String(r[key] || '').trim();
                if (!raw) return;
                const k = raw.toLowerCase();
                if (!map.has(k)) map.set(k, raw);
            });
            return [...map.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
        }

        function positionSortValue(pos) {
            const n = parseInt(String(pos ?? '').replace(/[^\d]/g, ''), 10);
            return Number.isFinite(n) ? n : 99999;
        }

        function eventResultRowHtml(r) {
            return '<tr><td>' + escapeHtml(String(r.position ?? '—')) + '</td><td>' +
                escapeHtml(r.skipper || '') + '</td><td>' +
                escapeHtml(r.yacht_club || '') + '</td><td>' +
                escapeHtml(r.category || '') + '</td><td>' +
                escapeHtml(r.sail_number || '') + '</td></tr>';
        }

        function renderEventResultsHtml(payload) {
            const rows = (payload && payload.rows) || [];
            const title = (payload && payload.regattaName) || 'Regatta';
            const date = formatChatDateLocal(payload && payload.regattaDate);
            const loc = displayLoc(payload && payload.location);
            const classes = uniqueEventOptions(rows, 'category');
            const clubs = uniqueEventOptions(rows, 'yacht_club');
            let html = '<h3>' + escapeHtml(title) + photoLinkHtml(title, payload && payload.regattaDate) + '</h3><p class="event-modal-meta">' +
                escapeHtml(date) + ' · ' + escapeHtml(loc) +
                ' · <span class="js-event-count">' + rows.length +
                ' result' + (rows.length === 1 ? '' : 's') + '</span></p>';
            html += '<div class="event-modal-toolbar"><label>Class<select class="js-event-class"><option value="">All classes</option>';
            classes.forEach(c => {
                html += '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
            });
            html += '</select></label><label>Club<select class="js-event-club"><option value="">All clubs</option>';
            clubs.forEach(c => {
                html += '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
            });
            html += '</select></label><label>Sort<select class="js-event-sort">' +
                '<option value="position">Position</option>' +
                '<option value="name-asc">Sailor A–Z</option>' +
                '<option value="name-desc">Sailor Z–A</option>' +
                '</select></label></div>';
            html += '<table class="data"><thead><tr><th>Position</th><th>Sailor</th><th>Club</th><th>Class</th><th>Sail</th></tr></thead><tbody class="js-event-tbody"></tbody></table>';
            return html;
        }

        function wireEventResultsView(body, payload) {
            const rows = (payload && payload.rows) || [];
            const classSel = body.querySelector('.js-event-class');
            const clubSel = body.querySelector('.js-event-club');
            const sortSel = body.querySelector('.js-event-sort');
            const tbody = body.querySelector('.js-event-tbody');
            const countEl = body.querySelector('.js-event-count');
            if (!tbody) return;

            const apply = () => {
                const cls = (classSel && classSel.value || '').toLowerCase();
                const club = (clubSel && clubSel.value || '').toLowerCase();
                const sort = (sortSel && sortSel.value) || 'position';
                let list = rows.filter(r => {
                    if (cls && String(r.category || '').trim().toLowerCase() !== cls) return false;
                    if (club && String(r.yacht_club || '').trim().toLowerCase() !== club) return false;
                    return true;
                });
                list.sort((a, b) => {
                    if (sort === 'name-asc' || sort === 'name-desc') {
                        const cmp = String(a.skipper || '').localeCompare(String(b.skipper || ''), undefined, { sensitivity: 'base' });
                        return sort === 'name-desc' ? -cmp : cmp;
                    }
                    const pos = positionSortValue(a.position) - positionSortValue(b.position);
                    if (pos !== 0) return pos;
                    return String(a.skipper || '').localeCompare(String(b.skipper || ''), undefined, { sensitivity: 'base' });
                });
                if (!list.length) {
                    tbody.innerHTML = '<tr><td colspan="5">No results match these filters.</td></tr>';
                } else {
                    tbody.innerHTML = list.map(eventResultRowHtml).join('');
                }
                if (countEl) {
                    if (list.length === rows.length) {
                        countEl.textContent = rows.length + ' result' + (rows.length === 1 ? '' : 's');
                    } else {
                        countEl.textContent = 'showing ' + list.length + ' of ' + rows.length + ' results';
                    }
                }
            };

            if (classSel) classSel.addEventListener('change', apply);
            if (clubSel) clubSel.addEventListener('change', apply);
            if (sortSel) sortSel.addEventListener('change', apply);
            apply();
        }

        async function openRegattaEventCard(name, date) {
            if (!name) return;
            const modal = ensureEventModal();
            const body = modal.querySelector('.js-event-body');
            body.innerHTML = '<h3>' + escapeHtml(name) + photoLinkHtml(name, date) + '</h3><p class="event-modal-meta">Loading event results…</p>';
            modal.classList.add('open');
            try {
                const params = new URLSearchParams({ name });
                if (date) params.set('date', date);
                const res = await fetch('/api/race-results/event?' + params.toString());
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Failed to load event');
                const payload = data.data || {};
                body.innerHTML = renderEventResultsHtml(payload);
                wireEventResultsView(body, payload);
            } catch (err) {
                body.innerHTML = '<h3>' + escapeHtml(name) + photoLinkHtml(name, date) + '</h3><p class="event-modal-meta">' +
                    escapeHtml(err.message || 'Could not load event results.') + '</p>';
            }
        }

        function renderResultsCard(data) {
            const rt = data.resultType || 'race_history';
            const hasList = (data.list && data.list.length);
            const hasRows = (data.rows && data.rows.length);
            let html = '';

            // New scraped-results chatbot shapes (same as admin ChatBot)
            if (rt === 'list' && hasRows) {
                const hasCount = data.rows.some(r => r.count != null);
                html += '<div class="section"><table class="data"><thead><tr><th>Name</th>' +
                    (hasCount ? '<th>Count</th>' : '') + '</tr></thead><tbody>';
                data.rows.forEach(r => {
                    html += '<tr><td>' + escapeHtml(r.name || r.skipper || r.yacht_club || '') + '</td>' +
                        (hasCount ? '<td>' + escapeHtml(String(r.count ?? '')) + '</td>' : '') + '</tr>';
                });
                html += '</tbody></table></div>';
            } else if (rt === 'sailor_card' && data.sailor) {
                return renderSailorCardHtml(data);
            } else if (rt === 'rows' && hasRows) {
                html += '<div class="section"><table class="data"><thead><tr><th>Pos</th><th>Sailor</th><th>Regatta</th><th>Date</th></tr></thead><tbody>';
                data.rows.slice(0, 20).forEach(r => {
                    html += '<tr><td>' + escapeHtml(String(r.position ?? '')) + '</td><td>' +
                        escapeHtml(r.skipper || '') + '</td><td>' +
                        escapeHtml(r.regatta_name || '') + '</td><td>' +
                        escapeHtml(r.regatta_date || '') + '</td></tr>';
                });
                html += '</tbody></table></div>';
            } else if (rt === 'summary') {
                html += '<div class="section basic-info"><h3>Database</h3><table>' +
                    '<tr><td>Sailors</td><td>' + escapeHtml(String(data.sailors ?? data.total_sailors ?? '—')) + '</td></tr>' +
                    '<tr><td>Regattas</td><td>' + escapeHtml(String(data.regattas ?? data.total_regattas ?? '—')) + '</td></tr>' +
                    '</table></div>';
            } else if (rt === 'regatta_summary' && (data.dates || data.sailorCount != null)) {
                const summaryName = data.regattaName || data.regatta_name || '';
                html += '<div class="section basic-info"><h3>' + escapeHtml(summaryName || 'Summary') +
                    photoLinkHtml(summaryName, (data.dates || [])[0]) +
                    '</h3><table><tr><td>Dates</td><td>' + escapeHtml((data.dates || []).join(', ') || '—') + '</td></tr><tr><td>Sailors</td><td>' + escapeHtml(String(data.sailorCount ?? '—')) + '</td></tr></table></div>';
                (data.byClass || []).forEach(function (bc) {
                    html += '<div class="section"><h3>Class: ' + escapeHtml(bc.class || '—') + '</h3><table class="data"><thead><tr><th>Position</th><th>Sailor</th><th>Club</th></tr></thead><tbody>';
                    (bc.topSailors || []).forEach(function (s) {
                        html += '<tr><td>' + escapeHtml(String(s.position ?? '')) + '</td><td>' + escapeHtml(s.skipper || '') + '</td><td>' + escapeHtml(s.yacht_club || '') + '</td></tr>';
                    });
                    html += '</tbody></table></div>';
                });
            } else if (rt === 'sailors_list' && hasList) {
                const sub = data.subtitle ? '<h3>' + escapeHtml(data.subtitle) + '</h3>' : '';
                html += '<div class="section">' + sub + '<table class="data"><thead><tr><th>Name</th><th>Regattas</th></tr></thead><tbody>';
                data.list.forEach(r => {
                    html += '<tr><td>' + escapeHtml(r.name || '') + '</td><td>' + escapeHtml(String(r.count ?? '')) + '</td></tr>';
                });
                html += '</tbody></table></div>';
            } else if (rt === 'clubs_list' && hasList) {
                const sub = data.subtitle ? '<h3>' + escapeHtml(data.subtitle) + '</h3>' : '';
                const hasCount = data.list.some(r => r.count != null);
                html += '<div class="section">' + sub + '<table class="data"><thead><tr><th>Club</th>' + (hasCount ? '<th>Count</th>' : '') + '</tr></thead><tbody>';
                data.list.forEach(r => {
                    html += '<tr><td>' + escapeHtml(r.name || '') + '</td>' + (hasCount ? '<td>' + escapeHtml(String(r.count ?? '')) + '</td>' : '') + '</tr>';
                });
                html += '</tbody></table></div>';
            } else if (hasRows) {
                const { basicInfo, totalRegattas, topPosition, rows } = data;
                if (basicInfo) {
                    html += '<div class="section basic-info"><h3>Basic Info</h3><table><tr><td>Name</td><td>' + escapeHtml(basicInfo.name) + '</td></tr><tr><td>Club</td><td>' + escapeHtml(basicInfo.club) + '</td></tr></table></div>';
                }
                html += '<div class="section"><h3>Top Achievements</h3><table class="data"><thead><tr><th>Position</th><th>Regatta Name</th><th>Date</th></tr></thead><tbody>';
                const topRows = (rows || []).filter(r => r.position != null && /^\d+$/.test(String(r.position).trim())).sort((a, b) => parseInt(a.position, 10) - parseInt(b.position, 10)).slice(0, 5);
                if (topRows.length) {
                    topRows.forEach(r => {
                        html += '<tr><td>' + escapeHtml(String(r.position)) + '</td><td>' + escapeHtml(r.regatta_name || '') + '</td><td>' + escapeHtml(r.regatta_date || '') + '</td></tr>';
                    });
                } else {
                    html += '<tr><td colspan="3">—</td></tr>';
                }
                html += '</tbody></table></div>';
                html += '<div class="section"><h3>Recent Race History</h3><table class="data"><thead><tr><th>Position</th><th>Regatta Name</th><th>Date</th></tr></thead><tbody>';
                (rows || []).forEach(r => {
                    html += '<tr><td>' + escapeHtml(String(r.position ?? '')) + '</td><td>' + escapeHtml(r.regatta_name || '') + '</td><td>' + escapeHtml(r.regatta_date || '') + '</td></tr>';
                });
                html += '</tbody></table></div>';
            } else {
                return '';
            }
            html += '<button type="button" class="view-full js-download-results">Download</button>';
            return html;
        }

        function doDownload(data) {
            if (!data) return;
            let cols, rows;
            if (data.resultType === 'regatta_summary' && (data.byClass?.length || data.dates?.length)) {
                cols = ['class', 'position', 'skipper', 'yacht_club'];
                rows = [];
                (data.byClass || []).forEach(function (bc) {
                    (bc.topSailors || []).forEach(function (s) {
                        rows.push({ class: bc.class, position: s.position, skipper: s.skipper, yacht_club: s.yacht_club || '' });
                    });
                });
                if (!rows.length && data.dates?.length) {
                    cols = ['regatta', 'dates', 'sailor_count'];
                    rows = [{ regatta: data.regattaName || '', dates: (data.dates || []).join('; '), sailor_count: data.sailorCount ?? '' }];
                } else if (!rows.length) return;
            } else if (data.resultType === 'sailor_card') {
                cols = ['position', 'regatta_name', 'regatta_date', 'category', 'location'];
                rows = data.regattaAchievements || data.history || [];
            } else if (data.list && data.list.length) {
                const hasCount = data.list.some(r => r.count != null);
                cols = hasCount ? ['name', 'count'] : ['name'];
                rows = data.list.map(r => hasCount ? { name: r.name, count: r.count } : { name: r.name });
            } else if (data.rows && data.rows.length) {
                cols = ['position', 'regatta_name', 'regatta_date'];
                rows = data.rows;
            } else return;
            const lines = [cols.join(',')];
            rows.forEach(r => {
                lines.push(cols.map(c => '"' + String(r[c] ?? '').replace(/"/g, '""') + '"').join(','));
            });
            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'sailing-results-' + Date.now() + '.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const t = String(s).trim();
            if (t.toUpperCase() === 'SOZNODATA') return '';
            const d = document.createElement('div');
            d.textContent = t || s;
            return d.innerHTML;
        }

        function addBotMsg(reply, data) {
            const div = document.createElement('div');
            div.className = 'msg bot';
            const showCard = data && (
                (data.list && data.list.length) ||
                (data.rows && data.rows.length) ||
                data.resultType === 'sailor_card' ||
                data.resultType === 'summary' ||
                data.resultType === 'list' ||
                data.resultType === 'rows' ||
                (data.resultType === 'regatta_summary' && (data.dates?.length || data.sailorCount != null || (data.byClass && data.byClass.length)))
            );
            const skipReply = data && data.resultType === 'sailor_card';
            if (skipReply) div.classList.add('wide');
            if (!skipReply && reply) {
                const md = document.createElement('div');
                md.className = 'markdown';
                md.innerHTML = simpleMarkdown(reply);
                div.appendChild(md);
            }
            if (showCard) {
                const cardHtml = renderResultsCard(data);
                if (cardHtml) {
                    const card = document.createElement('div');
                    card.className = 'results-card';
                    if (data.resultType === 'sailor_card') card.classList.add('sailor-card');
                    card.innerHTML = cardHtml;
                    const btn = card.querySelector('.js-download-results');
                    if (btn) btn.addEventListener('click', () => doDownload(data));
                    if (data.resultType === 'sailor_card') wireSailorCard(card, data);
                    div.appendChild(card);
                }
            }
            if (!div.childNodes.length) {
                div.textContent = reply || "I didn't find anything.";
            }
            chatPane.appendChild(div);
            chatPane.scrollTop = chatPane.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMsg(text, true);
            sendBtn.disabled = true;
            status.textContent = '';
            status.className = 'status';
            try {
                const res = await fetch('/api/race-results/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const j = await res.json();
                if (!j.success) {
                    status.textContent = j.error || 'Request failed';
                    status.className = 'status err';
                    addBotMsg("Sorry, I couldn't complete that. " + (j.error || 'Please try again.'));
                    return;
                }
                addBotMsg(j.reply || "I didn't find anything.", j.data);
            } catch (e) {
                status.textContent = e.message || 'Network error';
                status.className = 'status err';
                addBotMsg("Sorry, something went wrong. Please try again.");
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
        document.getElementById('newChatBtn').addEventListener('click', resetChat);
        chatPane.addEventListener('click', (e) => {
            const chip = e.target.closest('[data-prompt]');
            if (!chip) return;
            const prompt = chip.getAttribute('data-prompt');
            if (prompt === 'show sailor results') {
                addBotMsg('Type a sailor name.');
                input.focus();
                return;
            }
            input.value = prompt;
            send();
        });
    </script>
</body>
